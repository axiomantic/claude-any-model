name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/workflows/update-recommendations.yml'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  auto-release:
    name: Auto Tag & GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Next Version & Release Notes
        id: versioning
        run: |
          # Fetch all tags
          git fetch --tags origin || true
          
          # Get latest tag or default to v1.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "Latest tag: $LATEST_TAG"
          
          # Strip 'v' prefix
          VERSION_NUM=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          # If dispatch input provided, use it
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP="${{ inputs.bump_type }}"
          else
            # Determine bump from commit messages since last tag
            COMMITS=$(git log ${LATEST_TAG}..HEAD --oneline 2>/dev/null || git log -n 10 --oneline)
            if echo "$COMMITS" | grep -qE "BREAKING CHANGE|feat!|fix!"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qE "feat(\([a-zA-Z0-9_-]+\))?:"; then
              BUMP="minor"
            elif echo "$COMMITS" | grep -qE "fix(\([a-zA-Z0-9_-]+\))?:|docs(\([a-zA-Z0-9_-]+\))?:|refactor(\([a-zA-Z0-9_-]+\))?:|perf(\([a-zA-Z0-9_-]+\))?:"; then
              BUMP="patch"
            else
              BUMP="patch"
            fi
          fi
          
          if [ "$LATEST_TAG" = "v1.0.0" ] && [ $(git tag -l "v1.0.0") = "" ]; then
            NEXT_VERSION="1.0.0"
          else
            if [ "$BUMP" = "major" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [ "$BUMP" = "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          
          NEXT_TAG="v${NEXT_VERSION}"
          echo "Next version: $NEXT_VERSION ($NEXT_TAG)"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$NEXT_TAG" >> $GITHUB_OUTPUT

      - name: Generate Release Notes & Changelog
        id: notes
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$LATEST_TAG" ]; then
            LOG_RANGE="${LATEST_TAG}..HEAD"
          else
            LOG_RANGE="HEAD"
          fi
          
          echo "### Changes in $TAG" > release_notes.md
          echo "" >> release_notes.md
          git log $LOG_RANGE --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release_notes.md || echo "* Initial release" >> release_notes.md
          echo "" >> release_notes.md

      - name: Create GitHub Release & Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: Release ${{ steps.versioning.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
