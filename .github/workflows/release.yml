name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Automated Semver Release
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          release-type: simple

      - name: Log Release Information
        if: ${{ steps.release.outputs.release_created }}
        run: |
          echo "Release tag: ${{ steps.release.outputs.tag_name }}"
          echo "Release version: ${{ steps.release.outputs.version }}"
