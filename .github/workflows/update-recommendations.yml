name: Weekly Model Recommendations Update

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_pr:
        description: 'Force creating a PR even if no price/model shifts'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-model-recommendations:
    name: Scan OpenRouter Catalog & Propose Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Model Catalog Evaluator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/update_recommendations.py --apply

      - name: Push Automated Update Branch & Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git checkout -B automated/model-catalog-update
            git add claude-any-model MODEL_RECOMMENDATIONS_REPORT.md
            git commit -m "chore(models): weekly openrouter recommendations update"
            git push -f origin automated/model-catalog-update

            # Attempt creating or updating Pull Request
            gh pr create --base main --head automated/model-catalog-update \
              --title "🤖 Weekly OpenRouter Model Recommendations & Delta Update" \
              --body-file MODEL_RECOMMENDATIONS_REPORT.md \
              --label "automated-pr,models,dependencies" 2>/dev/null || \
            gh pr edit automated/model-catalog-update \
              --title "🤖 Weekly OpenRouter Model Recommendations & Delta Update" \
              --body-file MODEL_RECOMMENDATIONS_REPORT.md 2>/dev/null || true
          fi

      - name: Post Issue with Comparative Evaluation Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('MODEL_RECOMMENDATIONS_REPORT.md')) {
              const report = fs.readFileSync('MODEL_RECOMMENDATIONS_REPORT.md', 'utf8');
              const today = new Date().toISOString().split('T')[0];
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🤖 Weekly OpenRouter Comparative Scan Report (${today})`,
                body: report + "\n\n---\n*Proposed changes are available on branch [`automated/model-catalog-update`](https://github.com/" + context.repo.owner + "/" + context.repo.repo + "/tree/automated/model-catalog-update).* ",
                labels: ['model-catalog-scan', 'automated']
              });
            }


