name: Weekly Model Recommendations Update

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_pr:
        description: 'Force creating a PR even if no price/model shifts'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-model-recommendations:
    name: Scan OpenRouter Catalog & Propose Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Model Catalog Evaluator
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/update_recommendations.py --apply

      - name: Push Automated Update Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status --porcelain) ]]; then
            git checkout -B automated/model-catalog-update
            git add setup.sh MODEL_RECOMMENDATIONS_REPORT.md
            git commit -m "chore(models): weekly openrouter recommendations update"
            git push -f origin automated/model-catalog-update || true
          fi

      - name: Create Pull Request with Model Updates
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(models): weekly openrouter recommendations update"
          branch: automated/model-catalog-update
          delete-branch: true
          title: "🤖 Weekly OpenRouter Model Recommendations Update"
          body-path: MODEL_RECOMMENDATIONS_REPORT.md
          labels: |
            automated-pr
            models
            dependencies

      - name: Post Issue with Semantic Evaluation Report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('MODEL_RECOMMENDATIONS_REPORT.md')) {
              const report = fs.readFileSync('MODEL_RECOMMENDATIONS_REPORT.md', 'utf8');
              const today = new Date().toISOString().split('T')[0];
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🤖 Weekly OpenRouter Semantic Scan Report (${today})`,
                body: report + "\n\n---\n*Branch `automated/model-catalog-update` has been updated with proposed changes.*",
                labels: ['model-catalog-scan', 'automated']
              });
            }

